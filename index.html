<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awais Haider | Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        /* Video Background Section */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }

        .hero-content {
            z-index: 1;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 { font-size: 3rem; color: #38bdf8; }
        p.subtitle { font-size: 1.2rem; margin-bottom: 20px; color: #cbd5e1; }

        /* Skills Section */
        .section {
            padding: 80px 20px;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .skill-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            transition: 0.3s;
            border-bottom: 3px solid #38bdf8;
        }

        .skill-card:hover { transform: translateY(-10px); background: #334155; }
        .skill-card i { font-size: 3rem; margin-bottom: 10px; color: #38bdf8; }

        /* Contact Section */
        .contact-info {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            margin-top: 30px;
            text-align: left;
            display: inline-block;
            width: 100%;
            max-width: 600px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .contact-item i {
            margin-right: 15px;
            color: #38bdf8;
            font-size: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn:hover { background: #0ea5e9; transform: scale(1.05); }

        footer {
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Hero Section with Video -->
    <section class="hero">
        <!-- VIDEO PATH YAHAN DALEN -->
        <video autoplay muted loop playsinline id="bg-video">
            <source src="YOUR_VIDEO_PATH_HERE.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <img src="wasi.png" alt="Awais Haider" class="profile-img">
            <h1>Awais Haider</h1>
            <p class="subtitle">Professional Developer | HTML | CSS | JavaScript</p>
            <a href="#contact" class="btn">Hire Me</a>
        </div>
    </section>

    <!-- Skills Section -->
    <section class="section">
        <h2>My Expertise</h2>
        <div class="skills-grid">
            <div class="skill-card">
                <i class="fab fa-html5"></i>
                <h3>HTML5</h3>
            </div>
            <div class="skill-card">
                <i class="fab fa-css3-alt"></i>
                <h3>CSS3</h3>
            </div>
            <div class="skill-card">
                <i class="fab fa-js"></i>
                <h3>JavaScript</h3>
            </div>
            <div class="skill-card">
                <i class="fas fa-code"></i>
                <h3>Web Dev</h3>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="section" id="contact">
        <h2>Contact Information</h2>
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <p>Chakral, Chakwal, Pakistan</p>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone-alt"></i>
                <p>03342002756</p>
            </div>
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <p>wasicenter120@gmail.com</p>
            </div>
            <div style="text-align: center;">
                <a href="mailto:wasicenter120@gmail.com" class="btn">Send an Email</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Awais Haider. All Rights Reserved.</p>
    </footer>

    <script>
        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>

</body>
              </html>
